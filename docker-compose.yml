# ── VELOX — Docker Compose ───────────────────────────────────────────
# ARM credentials are NOT stored here.
# They are collected per-job via the web form and passed through Redis
# to the worker, which sets ARM_* as subprocess environment variables.

services:

  # ── Frontend (Nginx serving landing page) ──────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # ── FastAPI Backend ─────────────────────────────────────────────────
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Terraform Worker ─────────────────────────────────────────────────
  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379
      # Default Terraform remote state location
      # (can be overridden per-job via the form)
      TFSTATE_STORAGE_ACCOUNT: ${TFSTATE_STORAGE_ACCOUNT:-veloxtfstate}
      TFSTATE_RESOURCE_GROUP:  ${TFSTATE_RESOURCE_GROUP:-rg-velox-tfstate}
      TFSTATE_CONTAINER:       ${TFSTATE_CONTAINER:-tfstate}
      # ARM credentials are intentionally NOT set here.
      # Each job supplies its own credentials via the web form.
    depends_on:
      - redis
    volumes:
      - ./terraform:/terraform   # read-only source
      - tfwork:/tfwork              # per-job working copies
      - tfstate:/tfstate            # per-job .tfvars (auto-deleted after run)
    restart: unless-stopped

  # ── Redis (job queue + transient state store) ───────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

volumes:
  redis-data:
  tfwork:
  tfstate:
